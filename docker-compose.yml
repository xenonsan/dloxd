services:
  dloxd:
    image: node:20-bookworm-slim
    container_name: dloxd
    working_dir: /app

    command:
      - sh
      - -c
      - npm install --omit=dev && exec node server.js

    restart: unless-stopped

    ports:
      - "2525:2525"

    environment:
      PORT: "2525"
      UPSTREAM_ORIGIN: "https://bloxd.io"
      LOG_DIR: "/app/logs"
      UPSTREAM_TIMEOUT_MS: "30000"
      MAX_BODY_BYTES: "16777216"
      WS_QUEUE_MAX_BYTES: "1048576"
      SLOW_REQUEST_MS: "2000"
      NODE_ENV: "production"

    volumes:
      - /opt/apps/dloxd:/app
